[package]
name = "tray-for-projects"
version = "0.1.0"
description = "Lightweight Windows system-tray development project launcher"
authors = ["rairc"]
edition = "2021"

[lib]
name = "tray_for_projects_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "process",
  "io-util",
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
  "fs",
] }
dirs = "6"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
